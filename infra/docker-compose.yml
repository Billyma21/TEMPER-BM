# Services de développement TEMPER
# Démarrage : pnpm infra:up
# MAAYOUD
name: temper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temper
      POSTGRES_PASSWORD: temper
      POSTGRES_DB: temper
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temper']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: temper
      MINIO_ROOT_PASSWORD: temper-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

  mqtt:
    image: eclipse-mosquitto:2
    ports: ['1883:1883']
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
